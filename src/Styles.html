<style>
/* ============================================================
   منصة ابن خلدون للتدريب والتطوير المهني — الأنماط
   هوية: عنابي قطري (#8a1538) + ذهبي (#c9a227) + خلفيات هادئة
   ============================================================ */
:root{
  --maroon:#8a1538; --maroon-d:#6b0f2a; --maroon-l:#a83a5a; --maroon-bg:#faf3f5;
  --gold:#c9a227; --gold-d:#a8861a; --gold-l:#f3e7bd;
  --ink:#1f1a1c; --ink-2:#4b4145; --muted:#6f6468; --line:#e9dfe2; --line-2:#f1eaec;
  --bg:#f6f2f0; --card:#ffffff; --ok:#1b7a3d; --ok-bg:#e8f5ec; --warn:#8a4b00; --warn-bg:#fff4e0; --err:#b3261e; --err-bg:#fdecea; --info:#155e8a; --info-bg:#e7f1f8;
  --radius:14px; --radius-s:9px; --shadow:0 6px 24px rgba(60,20,30,.08); --shadow-s:0 2px 8px rgba(60,20,30,.06);
  --font:"Cairo","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.8;direction:rtl;min-height:100vh}
body.busy{cursor:progress}
a{color:var(--maroon)}
img{max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit}
[dir=ltr],.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.skip-link{position:absolute;top:-60px;right:12px;background:var(--maroon);color:#fff;padding:8px 14px;border-radius:8px;z-index:2000;font-weight:700;text-decoration:none}
.skip-link:focus{top:12px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- الإطار العام ---------- */
.brandbar{background:#fff;border-bottom:4px solid var(--maroon);box-shadow:var(--shadow-s)}
.brandbar img{display:block;width:100%;max-width:1180px;margin:0 auto;height:auto}
.topnav{background:var(--maroon);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topnav .wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:56px}
.topnav .title{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav .title small{display:block;font-weight:400;font-size:11.5px;opacity:.85;line-height:1.3}
.topnav a.nav,.topnav button.nav{color:#fff;text-decoration:none;background:transparent;border:0;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.topnav a.nav:hover,.topnav button.nav:hover,.topnav a.nav.active{background:rgba(255,255,255,.14)}
.topnav a.nav[aria-current=page]{background:rgba(255,255,255,.2)}
.topnav .user{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3a2a00;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.hamb{display:none}
.page{max-width:1180px;margin:0 auto;padding:22px 16px 60px;animation:fadeup .35s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.footerbar{background:#fff;border-top:4px solid var(--maroon);margin-top:auto}
.footerbar img{display:block;width:100%;max-width:1180px;margin:0 auto}
.footerbar .copy{text-align:center;color:var(--muted);font-size:12px;padding:8px 16px 14px}
#app{display:flex;flex-direction:column;min-height:100vh}
.mobnav{display:none}

/* ---------- المكونات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);padding:20px}
.card.tight{padding:14px 16px}
.card h2,.card h3{margin-top:0}
h1{font-size:24px;margin:0 0 6px;color:var(--maroon)}
h2{font-size:19px;margin:0 0 10px;color:var(--maroon)}
h3{font-size:16.5px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--maroon);color:#fff;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease,background .15s;line-height:1.4;min-height:42px}
.btn:hover{background:var(--maroon-d);box-shadow:0 4px 14px rgba(138,21,56,.25);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn.gold{background:var(--gold);color:#3a2a00}.btn.gold:hover{background:var(--gold-d);color:#fff}
.btn.ghost{background:#fff;color:var(--maroon);border-color:var(--maroon)}.btn.ghost:hover{background:var(--maroon-bg)}
.btn.soft{background:var(--maroon-bg);color:var(--maroon)}.btn.soft:hover{background:#f2e2e7}
.btn.danger{background:var(--err)}.btn.danger:hover{background:#8f1d17}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;font-size:13.5px;min-height:34px;border-radius:8px}
.btn.lg{padding:14px 26px;font-size:17px}
.btn.block{width:100%}
.btn .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
.btn.ghost .spin,.btn.soft .spin{border-color:rgba(138,21,56,.3);border-top-color:var(--maroon)}
@keyframes rot{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:700;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--err);display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--err)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=search],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(138,21,56,.12);outline:none}
input[type=email],input[type=password],input[type=url],input.ltr,textarea.ltr{direction:ltr;text-align:left}
input:disabled{background:var(--line-2);color:var(--ink-2)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--maroon)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--line-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.err{background:var(--err-bg);color:var(--err)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.maroon{background:var(--maroon-bg);color:var(--maroon)}.chip.gold{background:var(--gold-l);color:#5b4600}
.alert{padding:12px 14px;border-radius:10px;border:1px solid;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.alert.ok{background:var(--ok-bg);border-color:#bfe3c9;color:var(--ok)}.alert.err{background:var(--err-bg);border-color:#f3c2be;color:var(--err)}.alert.warn{background:var(--warn-bg);border-color:#f5d9a6;color:var(--warn)}.alert.info{background:var(--info-bg);border-color:#bcd7e8;color:var(--info)}
.alert .ic{font-size:18px;line-height:1.4}
.alert ul{margin:6px 0 0;padding-right:18px}
.progress{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--maroon),var(--maroon-l));border-radius:999px;transition:width .5s ease}
.progress.gold>span{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-s);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 0 auto auto;width:6px;height:100%;background:var(--maroon)}
.kpi.gold:before{background:var(--gold)}.kpi.ok:before{background:var(--ok)}.kpi.info:before{background:var(--info)}.kpi.err:before{background:var(--err)}
.kpi .n{font-size:30px;font-weight:800;color:var(--maroon);line-height:1.2}
.kpi .l{color:var(--muted);font-size:13.5px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
table.tbl th,table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:right;vertical-align:middle}
table.tbl th{background:var(--maroon-bg);color:var(--maroon);font-weight:700;position:sticky;top:0}
table.tbl tr:hover td{background:#fcf9fa}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}
.skeleton{background:linear-gradient(90deg,#eee 25%,#f7f7f7 50%,#eee 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;min-height:18px}
@keyframes sk{to{background-position:-200% 0}}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;border-radius:8px 8px 0 0}
.tabs button.active{color:var(--maroon);border-bottom-color:var(--maroon);background:var(--maroon-bg)}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeup .25s ease;display:flex;gap:10px;align-items:center}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}.toast.warn{background:var(--warn)}
.modal-bg{position:fixed;inset:0;background:rgba(30,10,15,.55);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--radius);width:min(100%,640px);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fadeup .25s ease}
.modal.wide{width:min(100%,1080px)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h3{margin:0;flex:1;color:var(--maroon)}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;position:sticky;bottom:0;background:#fff}
.xbtn{border:0;background:var(--line-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.offline{background:var(--warn);color:#fff;text-align:center;padding:6px;font-weight:700;display:none}
body.is-offline .offline{display:block}

/* ---------- المصادقة ---------- */
.auth-wrap{max-width:520px;margin:0 auto}
.auth-hero{text-align:center;margin-bottom:18px}
.auth-hero .logo{height:96px;width:auto;margin-bottom:6px;filter:drop-shadow(0 4px 10px rgba(138,21,56,.18))}
.auth-hero .vision{color:var(--gold-d);font-weight:700}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;flex-wrap:wrap;align-items:center}
.code-input{direction:ltr;text-align:center;font-size:26px;letter-spacing:10px;font-weight:800}

/* ---------- المتدرب ---------- */
.hero{background:linear-gradient(135deg,var(--maroon) 0%,var(--maroon-d) 70%);color:#fff;border-radius:var(--radius);padding:26px;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06);left:-70px;bottom:-140px}
.hero:before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(201,162,39,.25);right:-40px;top:-70px}
.hero h1{color:#fff;font-size:24px;margin:0 0 4px}
.hero p{margin:0;opacity:.9}
.hero .vision{color:var(--gold);font-weight:700;margin-top:8px}
.ws-card{display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s;text-decoration:none;color:inherit}
.ws-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ws-card .ttl{font-size:17px;font-weight:800;color:var(--maroon);margin:0}
.ws-card .desc{color:var(--ink-2);font-size:14px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ws-card .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mod-list{display:flex;flex-direction:column;gap:8px}
.mod-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;color:var(--ink);transition:background .15s}
.mod-item:hover{background:var(--maroon-bg)}
.mod-item .num{width:36px;height:36px;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.mod-item.done .num{background:var(--ok);color:#fff}
.mod-item.current .num{background:var(--gold);color:#3a2a00}
.content{font-size:16px;line-height:2}
.content h3{color:var(--maroon);margin:22px 0 8px;font-size:18px;padding-right:12px;border-right:4px solid var(--gold)}
.content p{margin:0 0 12px}
.content ul,.content ol{padding-right:24px;margin:0 0 12px}
.content li{margin-bottom:4px}
.content table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:14.5px;background:#fff}
.content table th,.content table td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.content table th{background:var(--maroon-bg);color:var(--maroon)}
.callout{border-radius:12px;padding:14px 16px;margin:14px 0;border-right:5px solid;background:#fff}
.callout .ct{font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.callout.example{border-color:var(--info);background:var(--info-bg)}.callout.tip{border-color:var(--ok);background:var(--ok-bg)}.callout.warning{border-color:var(--err);background:var(--err-bg)}.callout.remember{border-color:var(--gold-d);background:var(--gold-l)}.callout.activity{border-color:var(--maroon);background:var(--maroon-bg)}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{position:relative;padding-right:40px;margin-bottom:8px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;right:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--maroon);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.res-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.q-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px;background:#fff;min-width:0}
.q-card.unanswered{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.q-card .qt{font-weight:700;margin-bottom:10px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .12s,border .12s}
.opt:hover{background:var(--maroon-bg)}
.opt input{margin-top:6px;accent-color:var(--maroon);width:18px;height:18px;flex:none}
.opt.selected{border-color:var(--maroon);background:var(--maroon-bg)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.score-ring{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 10px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line-2) 0);position:relative}
.score-ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.score-ring span{position:relative;z-index:1;color:var(--c)}
.cert-thumb{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(180deg,#fff,#fbf7f8);display:flex;flex-direction:column;gap:6px}
.cert-view{overflow:auto;background:#666;padding:16px;border-radius:10px}
.cert-view .cert{transform-origin:top right;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- الإدارة ---------- */
.admin-layout{display:grid;grid-template-columns:230px 1fr;gap:18px}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;position:sticky;top:70px;align-self:start}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:700}
.side a.active,.side a:hover{background:var(--maroon-bg);color:var(--maroon)}
.side a .ic{width:24px;text-align:center}
.bar-list{display:flex;flex-direction:column;gap:8px}
.bar-list .b{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:13.5px}
.bar-list .b .track{height:12px;background:var(--line-2);border-radius:999px;overflow:hidden}
.bar-list .b .track>span{display:block;height:100%;background:var(--maroon);border-radius:999px}
.bar-list .b .track>span.gold{background:var(--gold)}
.bar-list .b .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor .mod{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff}
.editor .mod>.mh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--maroon-bg);border-radius:12px 12px 0 0;cursor:pointer}
.editor .mod>.mb{padding:14px;display:none}
.editor .mod.open>.mb{display:block}
.editor .sec{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfafb}
.editor .qed{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.editor .qed .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.editor .qed .opts label{display:flex;align-items:center;gap:6px}
.editor .qed .opts input[type=text]{min-height:38px}
.stage{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);margin-bottom:6px}
.stage .dot{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none}
.stage.done .dot{background:var(--ok)}.stage.running .dot{background:var(--gold);animation:pulse 1s infinite}.stage.failed .dot{background:var(--err)}
@keyframes pulse{50%{opacity:.4}}
pre.code{background:#1f1a1c;color:#f5efe6;padding:12px;border-radius:10px;direction:ltr;text-align:left;font-size:12.5px;overflow:auto;max-height:300px;white-space:pre-wrap}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop:focus{border-color:var(--maroon);color:var(--maroon)}
.imgprev{max-height:60px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px}

/* ---------- الطباعة ---------- */
@media print{
  body{background:#fff}
  body.print-cert #app>*:not(#printarea){display:none!important}
  body.print-cert .toast-wrap,body.print-cert .modal-bg{display:none!important}
  #printarea{display:block!important}
  #printarea .cert{box-shadow:none;transform:none!important;margin:0}
}
#printarea{display:none}

/* ---------- الاستجابة ---------- */
@media (max-width:980px){
  .grid.c4{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(2,1fr)}
  .admin-layout{grid-template-columns:1fr}
  .side{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  .side a{white-space:nowrap;padding:8px 10px}
}
@media (max-width:640px){
  body{font-size:15px}
  .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}
  .page{padding:14px 12px 90px}
  .card{padding:16px}
  .topnav .desk{display:none}
