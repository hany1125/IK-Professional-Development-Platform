<script>
/* ============================================================
   AppAdmin — لوحة الإدارة (الهيكل، النظرة العامة، الورش، المحرر، الذكاء الاصطناعي)
   ============================================================ */
var ADMIN_TABS = [['overview', 'نظرة عامة', '📊'], ['workshops', 'الورش', '📚'], ['results', 'المتدربون والنتائج', '👥'], ['certs', 'الشهادات', '🎓'], ['settings', 'الإعدادات', '⚙️'], ['logs', 'سجل العمليات', '🧾']];
function adminShell(tab, inner, title) {
  layout('<div class="admin-layout"><aside class="side" aria-label="أقسام الإدارة"><nav>' + ADMIN_TABS.map(function (t) { return '<a href="#/admin/' + t[0] + '" class="' + (tab === t[0] ? 'active' : '') + '"' + (tab === t[0] ? ' aria-current="page"' : '') + '><span class="ic" aria-hidden="true">' + t[2] + '</span>' + t[1] + '</a>'; }).join('') + '</nav></aside><section id="adminBody">' + inner + '</section></div>', { title: title || 'لوحة الإدارة' });
}
route('#/admin', function () { go('#/admin/overview'); }, 'admin');
function subTabs(root, tabs, loaders) {
  $$('.tabs button', root).forEach(function (b) { b.addEventListener('click', function () { $$('.tabs button', root).forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); }); b.classList.add('active'); b.setAttribute('aria-selected', 'true'); tabs.forEach(function (t) { var box = el(t[1]); box.style.display = b.dataset.t === t[0] ? '' : 'none'; if (b.dataset.t === t[0] && !box.innerHTML && loaders[t[0]]) loaders[t[0]](); }); }); });
}

/* ---------- نظرة عامة ---------- */
function barList(items, labelKey, valKey, maxVal, cls) {
  var max = maxVal || Math.max.apply(null, items.map(function (i) { return Number(i[valKey]) || 0; }).concat([1]));
  return '<div class="bar-list">' + items.map(function (i) { var v = Number(i[valKey]) || 0; return '<div class="b"><span class="lbl" title="' + h(i[labelKey]) + '">' + h(i[labelKey]) + '</span><div class="track" role="img" aria-label="' + h(i[labelKey]) + ': ' + v + '"><span class="' + (cls || '') + '" style="width:' + Math.round(v / max * 100) + '%"></span></div><b>' + v + (cls === 'pct' ? '%' : '') + '</b></div>'; }).join('') + '</div>';
}
route('#/admin/overview', function () {
  adminShell('overview', skeletonList(3), 'نظرة عامة');
  api('admin.overview').then(function (d) {
    var k = d.kpis;
    var mailWarn = k.mailFailed + k.mailQueued;
    el('adminBody').innerHTML = '<h1>نظرة عامة</h1><p class="sub">مؤشرات محسوبة من البيانات الفعلية للمنصة' + (d.mailQuota !== null && d.mailQuota !== undefined ? ' · حصة البريد المتبقية اليوم: <b>' + d.mailQuota + '</b>' : '') + '</p>' +
      '<div class="grid c4">' +
      '<div class="kpi"><div class="n">' + k.trainees + '</div><div class="l">متدرب نشط' + (k.pendingUsers ? ' <span class="chip warn">' + k.pendingUsers + ' بانتظار التفعيل</span>' : '') + (k.suspendedUsers ? ' <span class="chip err">' + k.suspendedUsers + ' موقوف</span>' : '') + '</div></div>' +
      '<div class="kpi info"><div class="n">' + k.workshopsPublished + '</div><div class="l">ورشة منشورة · ' + k.workshopsDraft + ' مسودة · ' + k.workshopsUnpublished + ' غير منشورة · ' + k.workshopsArchived + ' مؤرشفة</div></div>' +
      '<div class="kpi gold"><div class="n">' + k.participants + '</div><div class="l">مشارك (نسبة المشاركة ' + k.participationRate + '%)</div></div>' +
      '<div class="kpi ok"><div class="n">' + k.passed + '</div><div class="l">اجتياز · نسبة الإكمال ' + k.completionRate + '%</div></div>' +
      '<div class="kpi ok"><div class="n">' + k.certificates + '</div><div class="l">شهادة صادرة</div></div>' +
      '<div class="kpi"><div class="n">' + k.attempts + '</div><div class="l">محاولة اختبار</div></div>' +
      '<div class="kpi ' + (mailWarn ? 'err' : '') + '"><div class="n">' + k.mailFailed + '</div><div class="l">رسائل بريد متعذرة' + (k.mailQueued ? ' · ' + k.mailQueued + ' في الانتظار' : '') + (mailWarn ? ' <a href="#/admin/logs">معالجة</a>' : '') + '</div></div>' +
      '<div class="kpi ' + (d.aiKey.configured ? 'ok' : '') + '"><div class="n" style="font-size:18px">' + (d.aiKey.configured ? 'مفعّل' : 'غير مضبوط') + '</div><div class="l">الذكاء الاصطناعي (Claude) · <a href="#/admin/settings">الإعدادات</a></div></div></div>' +
      '<div class="grid c2" style="margin-top:18px;align-items:start">' +
      '<div class="card"><h2>الورش: المشاركون والمجتازون</h2>' + (d.byWorkshop.length ? '<h3 style="font-size:14px;color:var(--muted)">بدأ الورشة</h3>' + barList(d.byWorkshop, 'title', 'started') + '<h3 style="font-size:14px;color:var(--muted);margin-top:12px">اجتاز</h3>' + barList(d.byWorkshop, 'title', 'passed', Math.max.apply(null, d.byWorkshop.map(function (w) { return w.started; }).concat([1])), 'gold') : emptyState('📭', 'لا توجد ورش منشورة')) + '</div>' +
      '<div class="card"><h2>المقارنة بحسب الأقسام</h2>' + (d.byDepartment.length ? '<div class="table-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>القسم</th><th>الكادر</th><th>مشارك</th><th>اجتاز</th><th>نسبة المشاركة</th></tr></thead><tbody>' + d.byDepartment.map(function (r) { var pr = r.staff ? Math.round(r.participants / r.staff * 100) : 0; return '<tr><td>' + h(r.department) + '</td><td>' + r.staff + '</td><td>' + r.participants + '</td><td>' + r.passed + '</td><td><div class="progress" style="min-width:80px" role="progressbar" aria-valuenow="' + pr + '" aria-valuemin="0" aria-valuemax="100"><span style="width:' + pr + '%"></span></div><small>' + pr + '%</small></td></tr>'; }).join('') + '</tbody></table></div>' : emptyState('👥', 'لا يوجد متدربون بعد')) + '</div></div>' +
      '<div class="card" style="margin-top:16px"><div class="row between"><h2 style="margin:0">أحدث النتائج</h2><a class="btn sm soft" href="#/admin/results">كل النتائج والتقارير</a></div>' + (d.recent.length ? '<div class="table-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>المتدرب</th><th>القسم</th><th>الورشة</th><th>الاختبار</th><th>النتيجة</th><th>التاريخ</th></tr></thead><tbody>' + d.recent.map(function (r) { return '<tr><td>' + h(r.name) + '</td><td>' + h(r.department) + '</td><td>' + h(r.workshop) + '</td><td>' + (r.kind === 'final' ? 'نهائي' : 'الوحدة ' + (r.moduleIndex + 1)) + '</td><td><b>' + pct(r.percent) + '</b> ' + (r.passed ? '<span class="chip ok">اجتاز</span>' : '<span class="chip err">لم يجتز</span>') + '</td><td>' + fmtDate(r.at, true) + '</td></tr>'; }).join('') + '</tbody></table></div>' : emptyState('📭', 'لا توجد نتائج بعد')) + '</div>';
  }).catch(function (e) { el('adminBody').innerHTML = alertBox('err', h(errMsg(e))); });
}, 'admin');

/* ---------- قائمة الورش ---------- */
route('#/admin/workshops', function () {
  adminShell('workshops', skeletonList(3), 'الورش');
  api('admin.ws.list').then(function (d) {
    var rows = d.workshops.map(function (w) {
      return '<tr><td><a href="#/admin/ws/' + h(w.id) + '"><b>' + h(w.title) + '</b></a><br><small style="color:var(--muted)">' + w.moduleCount + ' وحدات · ' + h(w.category || '') + (w.source === 'ai' ? ' · <span class="chip gold">مولّدة بالذكاء الاصطناعي</span>' : w.source === 'ai-manual' ? ' · <span class="chip gold">مستوردة JSON</span>' : '') + '</small></td><td>' + chipStatus(w.status) + '</td><td>' + (w.scheduledAt ? fmtDate(w.scheduledAt, true) : '—') + '</td><td>' + w.stats.started + ' / ' + w.stats.passed + '</td><td>' + fmtDate(w.updatedAt) + '</td><td><a class="btn sm ghost" href="#/admin/ws/' + h(w.id) + '">تحرير</a></td></tr>';
    }).join('');
    el('adminBody').innerHTML = '<div class="row between"><div><h1>الورش التدريبية</h1><p class="sub">إنشاء الورش وتحريرها ونشرها</p></div><div class="row"><button class="btn gold" id="btnAI" type="button">✨ توليد بالذكاء الاصطناعي</button><button class="btn" id="btnNew" type="button">＋ ورشة جديدة</button></div></div>' +
      '<div class="card">' + (rows ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>الورشة</th><th>الحالة</th><th>الموعد</th><th>بدأ / اجتاز</th><th>آخر تحديث</th><th><span class="sr-only">إجراءات</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : emptyState('📚', 'لا توجد ورش بعد', 'ابدأ بإنشاء ورشة يدويًا أو بتوليدها بالذكاء الاصطناعي')) + '</div>';
    el('btnNew').addEventListener('click', newWorkshopDlg);
    el('btnAI').addEventListener('click', aiWizard);
  }).catch(function (e) { el('adminBody').innerHTML = alertBox('err', h(errMsg(e))); });
}, 'admin');

function newWorkshopDlg() {
  var m = modal({ title: 'ورشة جديدة', body: '<form id="fNewWs">' + field({ id: 'nwTitle', name: 'title', label: 'عنوان الورشة', required: true }) + field({ id: 'nwDesc', name: 'description', type: 'textarea', label: 'الوصف', rows: 3 }) +
    '<div class="grid c2">' + field({ id: 'nwMods', name: 'moduleCount', type: 'number', label: 'عدد الوحدات (هيكل أولي)', value: 3, min: 1, max: 8 }) + field({ id: 'nwPass', name: 'passScore', type: 'number', label: 'نسبة النجاح %', value: S.settings.defaultPassScore, min: 1, max: 100 }) + '</div>' +
    field({ id: 'nwOutline', name: 'outline', type: 'textarea', label: 'عناوين الوحدات (اختياري — افصل بينها بفاصلة أو سطر)', rows: 2 }) + '</form>',
    footer: '<button class="btn" id="nwGo">إنشاء الهيكل وفتح المحرر</button><button class="btn ghost" data-close>إلغاء</button>' });
  $('#nwGo', m.el).addEventListener('click', function () {
    var d = formData($('#fNewWs', m.el)); if (!d.title || d.title.trim().length < 5) { setFieldErr('nwTitle', 'أدخل عنوان الورشة (5 أحرف على الأقل)'); return; }
    var b = this; busyBtn(b, true);
    api('admin.ws.skeleton', { topic: d.title, description: d.description, moduleCount: d.moduleCount, passScore: d.passScore, outline: d.outline })
      .then(function (r) { return api('admin.ws.create', { title: d.title, description: d.description, passScore: d.passScore, content: r.content, source: 'manual' }); })
      .then(function (r) { m.close(); toast('تم إنشاء الورشة كمسودة', 'ok'); go('#/admin/ws/' + r.workshop.id); }).catch(function (e) { showErr(e); busyBtn(b, false); });
  });
}

/* ---------- محرر الورشة ---------- */
var ED = null; // {workshop, content, versions}
function edSectionHtml(mi, si, s) {
  var types = [['text', 'نص'], ['list', 'قائمة'], ['steps', 'خطوات'], ['table', 'جدول'], ['example', 'مثال تطبيقي'], ['tip', 'نصيحة'], ['warning', 'تنبيه / أخطاء شائعة'], ['remember', 'نقاط للتذكر'], ['activity', 'نشاط تأملي']];
  var isList = ['list', 'steps', 'remember'].indexOf(s.type) !== -1, isTable = s.type === 'table';
  return '<div class="sec" data-mi="' + mi + '" data-si="' + si + '"><div class="row"><select class="sType" style="width:auto;min-height:38px" aria-label="نوع القسم">' + types.map(function (t) { return '<option value="' + t[0] + '"' + (s.type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') + '</select>' +
    '<input type="text" class="sTitle" value="' + h(s.title || '') + '" placeholder="عنوان القسم" style="flex:1;min-height:38px" aria-label="عنوان القسم"><button class="btn sm soft sUp" type="button" title="أعلى" aria-label="نقل القسم لأعلى">↑</button><button class="btn sm soft sDown" type="button" title="أسفل" aria-label="نقل القسم لأسفل">↓</button><button class="btn sm danger sDel" type="button" aria-label="حذف القسم">✕</button></div>' +
    (isTable ? '<textarea class="sRows" rows="4" placeholder="صف في كل سطر، والخلايا مفصولة بـ | — السطر الأول عناوين الأعمدة" style="margin-top:6px" aria-label="صفوف الجدول">' + h((s.rows || []).map(function (r) { return r.join(' | '); }).join('\n')) + '</textarea>'
      : '<textarea class="sBody" rows="' + (s.type === 'text' ? 6 : 3) + '" placeholder="' + (isList ? 'نص تمهيدي (اختياري)' : 'المحتوى — افصل الفقرات بسطر فارغ، ويمكن استخدام **غامق**') + '" style="margin-top:6px" aria-label="نص القسم">' + h(s.body || '') + '</textarea>' +
        (isList ? '<textarea class="sItems" rows="4" placeholder="عنصر في كل سطر" style="margin-top:6px" aria-label="عناصر القائمة">' + h((s.items || []).join('\n')) + '</textarea>' : '')) + '</div>';
}
function edQuestionHtml(scope, qi, q) {
  return '<div class="qed" data-scope="' + scope + '" data-qi="' + qi + '"><div class="row"><b style="flex:1">السؤال ' + (qi + 1) + '</b><button class="btn sm danger qDel" type="button" aria-label="حذف السؤال ' + (qi + 1) + '">✕</button></div>' +
    '<input type="text" class="qText" value="' + h(q.text || '') + '" placeholder="نص السؤال" style="margin:6px 0" aria-label="نص السؤال ' + (qi + 1) + '"><div class="opts">' + [0, 1, 2, 3].map(function (oi) { return '<label><input type="radio" name="ans_' + scope + '_' + qi + '" value="' + oi + '"' + (Number(q.answer) === oi ? ' checked' : '') + ' title="الإجابة الصحيحة" aria-label="الخيار ' + (oi + 1) + ' هو الإجابة الصحيحة"><input type="text" class="qOpt" value="' + h((q.options || [])[oi] || '') + '" placeholder="الخيار ' + (oi + 1) + '" aria-label="نص الخيار ' + (oi + 1) + '"></label>'; }).join('') + '</div>' +
    '<div class="hint">حدّد الإجابة الصحيحة بالضغط على الدائرة بجوار الخيار.</div>' +
    '<input type="text" class="qExp" value="' + h(q.explanation || '') + '" placeholder="توضيح الإجابة (يظهر في التغذية الراجعة)" style="margin-top:6px" aria-label="توضيح الإجابة"></div>';
}
function edModuleHtml(mi, m) {
  return '<div class="mod" data-mi="' + mi + '"><div class="mh" role="button" tabindex="0" aria-expanded="false"><span class="num chip maroon">' + (mi + 1) + '</span><b style="flex:1" class="mTitleLbl">' + h(m.title || 'وحدة بلا عنوان') + '</b><button class="btn sm soft mUp" type="button" aria-label="نقل الوحدة لأعلى">↑</button><button class="btn sm soft mDown" type="button" aria-label="نقل الوحدة لأسفل">↓</button><button class="btn sm danger mDel" type="button" aria-label="حذف الوحدة">✕</button></div>' +
    '<div class="mb"><div class="grid c2"><div class="field"><label for="mt' + mi + '">عنوان الوحدة</label><input id="mt' + mi + '" type="text" class="mTitle" value="' + h(m.title || '') + '"></div><div class="field"><label for="ms' + mi + '">ملخص الوحدة</label><input id="ms' + mi + '" type="text" class="mSummary" value="' + h(m.summary || '') + '"></div></div>' +
    '<div class="field"><label for="mo' + mi + '">الأهداف السلوكية (هدف في كل سطر)</label><textarea id="mo' + mi + '" class="mObj" rows="3">' + h((m.objectives || []).join('\n')) + '</textarea></div>' +
    '<h3>المحتوى</h3><div class="secs">' + (m.sections || []).map(function (s, si) { return edSectionHtml(mi, si, s); }).join('') + '</div><button class="btn sm soft addSec" type="button">＋ إضافة قسم</button>' +
    '<h3 style="margin-top:14px">الموارد والروابط</h3><p class="hint">سطر لكل مورد بالصيغة: العنوان | الرابط | النوع (link أو video أو file). تُقبل روابط http/https فقط.</p><textarea class="mRes" rows="2" aria-label="الموارد">' + h((m.resources || []).map(function (r) { return (r.title || '') + ' | ' + r.url + ' | ' + (r.type || 'link'); }).join('\n')) + '</textarea>' +
    '<h3 style="margin-top:14px">أسئلة الوحدة (' + (m.questions || []).length + ')</h3><div class="qs">' + (m.questions || []).map(function (q, qi) { return edQuestionHtml('m' + mi, qi, q); }).join('') + '</div><button class="btn sm soft addQ" type="button">＋ إضافة سؤال</button></div></div>';
}
/** قراءة محتوى المحرر من DOM إلى كائن */
function edCollect() {
  var root = el('edRoot');
  var content = { objectives: el('wsObjectives').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean), modules: [], finalQuiz: { questions: [] } };
  var readQ = function (qel) { var opts = $$('.qOpt', qel).map(function (i) { return i.value; }); var a = $('input[type=radio]:checked', qel); return { text: $('.qText', qel).value, options: opts, answer: a ? parseInt(a.value, 10) : 0, explanation: $('.qExp', qel).value }; };
  $$('.mod', root).forEach(function (mel) {
    var m = { title: $('.mTitle', mel).value, summary: $('.mSummary', mel).value, objectives: $('.mObj', mel).value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean), sections: [], resources: [], questions: [] };
    $$('.sec', mel).forEach(function (sel) {
      var t = $('.sType', sel).value, s = { type: t, title: $('.sTitle', sel).value };
      if (t === 'table') s.rows = $('.sRows', sel).value.split('\n').filter(function (r) { return r.trim(); }).map(function (r) { return r.split('|').map(function (c) { return c.trim(); }); });
      else { s.body = $('.sBody', sel).value; var it = $('.sItems', sel); if (it) s.items = it.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }
      m.sections.push(s);
    });
    $('.mRes', mel).value.split('\n').forEach(function (line) { var p = line.split('|').map(function (x) { return x.trim(); }); if (p.length >= 2 && p[1]) m.resources.push({ title: p[0], url: p[1], type: p[2] || 'link' }); });
    $$('.qed', mel).forEach(function (q) { m.questions.push(readQ(q)); });
    content.modules.push(m);
  });
  $$('#finalQs .qed', root).forEach(function (q) { content.finalQuiz.questions.push(readQ(q)); });
  return content;
}
function edMeta() {
  var f = el('fMeta'); var d = formData(f);
  d.targetDepartments = $$('input[name=dept]:checked', f).map(function (i) { return i.value; });
  if (d.scheduledAt) { var dt = new Date(d.scheduledAt); d.scheduledAt = isNaN(dt) ? '' : dt.toISOString(); }
  return d;
}
function toLocalInput(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return ''; var p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

route('#/admin/ws/:id', function (id) {
  adminShell('workshops', skeletonList(3), 'محرر الورشة');
  api('admin.ws.get', { id: id }).then(function (d) {
    ED = { workshop: d.workshop, content: d.content, versions: d.versions };
    renderEditor();
  }).catch(function (e) { el('adminBody').innerHTML = alertBox('err', h(errMsg(e))) + '<a class="btn" href="#/admin/workshops">العودة</a>'; });
}, 'admin');

function renderEditor() {
  var w = ED.workshop, c = ED.content, st = S.settings;
  var statusBtns = '';
  if (w.status === 'draft' || w.status === 'unpublished') statusBtns = '<button class="btn ok" type="button" data-status="published">🚀 نشر الورشة</button>';
  if (w.status === 'published') statusBtns = '<button class="btn soft" type="button" data-status="unpublished">إلغاء النشر</button><button class="btn soft" type="button" id="btnNotify">📧 إشعار الموظفين</button>' + (w.trainerEmail ? '<button class="btn soft" type="button" id="btnThank">🙏 شهادة شكر للمدرب</button>' : '');
  if (w.status !== 'archived') statusBtns += '<button class="btn ghost" type="button" data-status="archived">أرشفة</button>'; else statusBtns += '<button class="btn soft" type="button" data-status="draft">إعادة تفعيل كمسودة</button><button class="btn danger" type="button" id="btnDelete">حذف نهائي</button>';
  var versionsInfo = ED.versions.length ? '<details style="margin-top:8px"><summary>إصدارات المحتوى (' + ED.versions.length + ')</summary><ul class="hint">' + ED.versions.map(function (v) { return '<li>الإصدار ' + v.version + (v.current ? ' <span class="chip ok">الحالي</span>' : '') + ' — ' + fmtDate(v.createdAt, true) + ' — ' + v.attempts + ' محاولة مرتبطة</li>'; }).join('') + '</ul></details>' : '';
  el('adminBody').innerHTML = '<div class="row between"><div><a href="#/admin/workshops" class="btn sm soft">← الورش</a> ' + chipStatus(w.status) + (w.notifiedAt ? ' <span class="chip">أُشعر الموظفون ' + fmtDate(w.notifiedAt) + '</span>' : '') + (w.trainerThankedAt ? ' <span class="chip ok">شُكر المدرب</span>' : '') + '</div><div class="row"><button class="btn ghost" type="button" id="btnValidate">✔ التحقق</button><button class="btn ghost" type="button" id="btnPreview">👁 معاينة</button><button class="btn ghost" type="button" id="btnJson">{ } JSON</button><button class="btn" type="button" id="btnSave">💾 حفظ</button></div></div>' +
    '<div class="card" style="margin-top:12px"><h2>بيانات الورشة</h2><form id="fMeta" onsubmit="return false"><div class="grid c2">' +
    field({ id: 'wTitle', name: 'title', label: 'العنوان', value: w.title, required: true }) + field({ id: 'wCat', name: 'category', label: 'المجال', value: w.category }) + '</div>' +

  function renderJob(job) {
    currentJob = job;
    var box = $('#aiJobBox', m.el);
    var idx = job.stageIndex;
    box.innerHTML = '<div class="card tight" style="margin:10px 0"><div class="row between"><b>' + (job.plan ? h(job.plan.title) : h(job.input.topic)) + '</b>' + chipStatus(job.status) + '</div>' +
      '<div role="list">' + job.stages.map(function (s, i) { var cls = i < idx ? 'done' : (i === idx ? (job.status === 'failed' ? 'failed' : (job.status === 'running' && running ? 'running' : '')) : ''); return '<div class="stage ' + cls + '" role="listitem"><span class="dot" aria-hidden="true"></span><span style="flex:1">' + h(stageLabel(s)) + '</span>' + (i < idx ? '<span class="chip ok">تم</span>' : (i === idx && job.status === 'failed' ? '<span class="chip err">فشل</span>' : (i === idx && job.status === 'running' && running ? '<span class="chip warn">جارٍ</span>' : ''))) + '</div>'; }).join('') + '</div>' +
      (job.error ? alertBox('err', h(job.error)) : '') +
      (job.warnings.length ? alertBox('warn', job.warnings.map(h).join('<br>')) : '') +
      (job.usage && job.usage.calls ? '<p class="hint">استدعاءات: ' + job.usage.calls + ' · رموز الإدخال ' + job.usage.input + ' · رموز الإخراج ' + job.usage.output + '</p>' : '') +
      '<details style="margin-top:6px"><summary>سجل المراحل (' + job.log.length + ')</summary><pre class="code" style="direction:rtl;text-align:right">' + job.log.map(h).join('\n') + '</pre></details>' +
      '<div class="row" style="margin-top:8px">' + (job.status === 'done' ? '<a class="btn ok" href="#/admin/ws/' + h(job.workshopId) + '">فتح المسودة للمراجعة</a>' : '') + (job.status === 'failed' || job.status === 'cancelled' ? '<button class="btn gold" id="aiResume" type="button">إعادة المحاولة / استئناف من آخر مرحلة ناجحة</button>' : '') + (job.status === 'running' && running ? '<button class="btn danger" id="aiCancel" type="button">إلغاء</button>' : (job.status === 'running' ? '<button class="btn gold" id="aiResume" type="button">استئناف</button>' : '')) + '</div></div>';
    if ($('#aiResume', box)) $('#aiResume', box).addEventListener('click', function () { runLoop(job.id); });
    if ($('#aiCancel', box)) $('#aiCancel', box).addEventListener('click', function () { running = false; api('admin.ai.cancel', { jobId: job.id }).then(function (r) { renderJob(r.job); }).catch(showErr); });
    if (job.status === 'done') $$('a[href^="#/admin/ws/"]', box).forEach(function (a) { a.addEventListener('click', function () { m.close(); }); });
  }
  function runLoop(jobId) {
    running = true;
    var step = function () {
      if (!running) return;
      api('admin.ai.step', { jobId: jobId }).then(function (r) { renderJob(r.job); if (r.job.status === 'running' && running) setTimeout(step, 400); else running = false; if (r.job.status === 'done') toast('اكتمل التوليد وحُفظت الورشة كمسودة', 'ok'); })
        .catch(function (e) { running = false; showErr(e); if (currentJob) renderJob(currentJob); });
    };
    step();
  }
  $('#aiStart', m.el).addEventListener('click', function () {
    var d = formData($('#aiForm', m.el)); if (!d.topic || d.topic.trim().length < 5) { setFieldErr('aiTopic', 'أدخل موضوع الورشة (5 أحرف على الأقل)'); return; }
    var b = this; busyBtn(b, true);
    api('admin.ai.start', d).then(function (r) { busyBtn(b, false); renderJob(r.job); runLoop(r.job.id); }).catch(function (e) { busyBtn(b, false); showErr(e); });
  });
  $('#aiJobs', m.el).addEventListener('click', function () {
    api('admin.ai.list').then(function (r) {
      var box = $('#aiJobBox', m.el);
      box.innerHTML = r.jobs.length ? '<div class="table-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>الموضوع</th><th>الحالة</th><th>المرحلة</th><th>التاريخ</th><th><span class="sr-only">فتح</span></th></tr></thead><tbody>' + r.jobs.map(function (j) { return '<tr><td>' + h(j.plan ? j.plan.title : j.input.topic) + '</td><td>' + chipStatus(j.status) + '</td><td>' + h(stageLabel(j.stage)) + '</td><td>' + fmtDate(j.createdAt, true) + '</td><td><button class="btn sm soft" type="button" data-job="' + h(j.id) + '">فتح</button></td></tr>'; }).join('') + '</tbody></table></div>' : emptyState('📭', 'لا توجد مهام سابقة');
      $$('[data-job]', box).forEach(function (b) { b.addEventListener('click', function () { api('admin.ai.get', { jobId: b.dataset.job }).then(function (rr) { renderJob(rr.job); }).catch(showErr); }); });
    }).catch(showErr);
  });
  $('#mnPrompt', m.el).addEventListener('click', function () {
    var d = formData($('#mnForm', m.el)); if (!d.topic || d.topic.trim().length < 5) { setFieldErr('mnTopic', 'أدخل موضوع الورشة'); return; }
    api('admin.ai.prompt', d).then(function (r) { var box = $('#mnPromptBox', m.el); box.style.display = ''; box.textContent = r.prompt; box.style.direction = 'rtl'; box.style.textAlign = 'right'; if (navigator.clipboard) navigator.clipboard.writeText(r.prompt).then(function () { toast('تم نسخ الأمر إلى الحافظة', 'ok'); }).catch(function () { toast('انسخ الأمر من المربع أدناه', 'info'); }); }).catch(showErr);
  });
  $('#mnCheck', m.el).addEventListener('click', function () {
    var d = formData($('#mnForm', m.el)); var b = this; busyBtn(b, true);
    api('admin.ai.importJson', { json: $('#mnJson', m.el).value, passScore: d.passScore, dryRun: true }).then(function (r) {
      $('#mnImport', m.el).disabled = false;
      $('#mnMsg', m.el).innerHTML = alertBox(r.issues.length ? 'warn' : 'ok', '«' + h(r.summary.title) + '» — ' + r.summary.modules + ' وحدات (' + r.summary.words.join('، ') + ' كلمة) · ' + r.summary.finalQuestions + ' أسئلة نهائية.' + (r.issues.length ? '<br>ملاحظات (يمكن الحفظ كمسودة ومعالجتها في المحرر):<ul>' + r.issues.map(function (i) { return '<li>' + h(i) + '</li>'; }).join('') + '</ul>' : ' JSON صالح.'));
    }).catch(function (e) { $('#mnImport', m.el).disabled = true; $('#mnMsg', m.el).innerHTML = alertBox('err', h(errMsg(e))); }).then(function () { busyBtn(b, false); });
  });
  $('#mnImport', m.el).addEventListener('click', function () {
    var d = formData($('#mnForm', m.el)); var b = this; busyBtn(b, true);
    api('admin.ai.importJson', { json: $('#mnJson', m.el).value, passScore: d.passScore, audience: d.audience }).then(function (r) { m.close(); toast('تم حفظ الورشة كمسودة للمراجعة', 'ok'); go('#/admin/ws/' + r.workshop.id); }).catch(function (e) { showErr(e); busyBtn(b, false); });
  });
  $('#skGo', m.el).addEventListener('click', function () {
    var d = formData($('#skForm', m.el)); if (!d.topic || d.topic.trim().length < 5) { setFieldErr('skTopic', 'أدخل موضوع الورشة'); return; }
    var b = this; busyBtn(b, true);
    api('admin.ws.skeleton', d).then(function (r) { return api('admin.ws.create', { title: d.topic, description: d.description, audience: d.audience, passScore: d.passScore, content: r.content, source: 'manual' }); })
      .then(function (r) { m.close(); toast('تم إنشاء الهيكل كمسودة', 'ok'); go('#/admin/ws/' + r.workshop.id); }).catch(function (e) { showErr(e); busyBtn(b, false); });
  });
}
</script>
