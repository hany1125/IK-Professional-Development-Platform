<script>
/* ============================================================
   AppAdmin2 — المتدربون والنتائج والتقارير، الشهادات، الإعدادات، السجلات والنسخ الاحتياطي
   ============================================================ */

/* ---------- المتدربون والنتائج ---------- */
route('#/admin/results', function () {
  adminShell('results', '<div class="tabs" role="tablist"><button class="active" data-t="res" role="tab" aria-selected="true">النتائج والتقارير</button><button data-t="users" role="tab" aria-selected="false">إدارة الحسابات</button></div><div id="resTab"></div><div id="usersTab" style="display:none"></div>', 'المتدربون والنتائج');
  subTabs(el('adminBody'), [['res', 'resTab'], ['users', 'usersTab']], { users: loadUsers });
  loadResults();
}, 'admin');

function loadResults() {
  var st = S.settings;
  var box = el('resTab');
  box.innerHTML = '<div class="card"><form id="fFilter" class="grid c4" style="align-items:end">' +
    field({ id: 'flQ', name: 'q', type: 'search', label: 'بحث (اسم/بريد/ورشة)' }) + '<div class="field"><label for="flWs">الورشة</label><select id="flWs" name="workshopId"><option value="">الكل</option></select></div>' +
    field({ id: 'flDept', name: 'department', type: 'select', label: 'القسم', options: [{ value: '', label: 'الكل' }].concat(st.departments) }) +
    field({ id: 'flStatus', name: 'status', type: 'select', label: 'الحالة', options: [{ value: '', label: 'الكل' }, { value: 'passed', label: 'اجتاز' }, { value: 'failed', label: 'لم يجتز' }, { value: 'inprogress', label: 'قيد التقدم' }] }) +
    field({ id: 'flFrom', name: 'from', type: 'date', label: 'من تاريخ', cls: 'ltr' }) + field({ id: 'flTo', name: 'to', type: 'date', label: 'إلى تاريخ', cls: 'ltr' }) +
    '<div class="field"><button class="btn" type="submit">تصفية</button></div><div class="field"><div class="row"><button class="btn ghost" type="button" id="btnCsv">⬇ تصدير CSV (Excel)</button><button class="btn ghost" type="button" id="btnReport">📊 تقرير تحليلي</button></div></div></form></div>' +
    '<div id="resBody" style="margin-top:14px">' + skeletonList(2) + '</div>';
  api('admin.ws.list').then(function (d) { el('flWs').innerHTML = '<option value="">الكل</option>' + d.workshops.map(function (w) { return '<option value="' + h(w.id) + '">' + h(w.title) + '</option>'; }).join(''); }).catch(function () { });
  var run = function () {
    var f = formData(el('fFilter'));
    el('resBody').innerHTML = skeletonList(2);
    api('admin.results', f).then(function (r) {
      var statusMap = { passed: '<span class="chip ok">اجتاز</span>', failed: '<span class="chip err">لم يجتز</span>', inprogress: '<span class="chip info">قيد التقدم</span>' };
      el('resBody').innerHTML = '<div class="card"><div class="row between"><h2 style="margin:0">النتائج (' + r.total + ')</h2></div>' + (r.rows.length ? '<div class="table-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>المتدرب</th><th>القسم</th><th>الورشة</th><th>الوحدات</th><th>المحاولات</th><th>أفضل</th><th>آخر</th><th>الحالة</th><th>الاجتياز</th><th>الشهادة</th></tr></thead><tbody>' +
        r.rows.map(function (x) { return '<tr><td><b>' + h(x.name) + '</b><br><small dir="ltr">' + h(x.email) + '</small></td><td>' + h(x.department) + '</td><td>' + h(x.workshop) + '</td><td>' + x.modulesDone + '/' + x.moduleCount + '</td><td>' + x.attempts + '</td><td>' + (x.bestPercent === null ? '—' : pct(x.bestPercent)) + '</td><td>' + (x.lastPercent === null ? '—' : pct(x.lastPercent)) + '</td><td>' + statusMap[x.status] + '</td><td>' + fmtDate(x.passedAt, true) + '</td><td>' + (x.certificateId ? '<a href="#/cert/' + h(x.certificateId) + '" dir="ltr" data-certback>' + h(x.certificateSerial) + '</a>' : '—') + '</td></tr>'; }).join('') + '</tbody></table></div>' : emptyState('📭', 'لا توجد نتائج مطابقة')) + '</div>';
      $$('[data-certback]', el('resBody')).forEach(function (a) { a.addEventListener('click', function () { store('certBack', 'admin'); }); });
    }).catch(function (e) { el('resBody').innerHTML = alertBox('err', h(errMsg(e))); });
  };
  el('fFilter').addEventListener('submit', function (e) { e.preventDefault(); run(); });
  el('btnCsv').addEventListener('click', function () { var b = this; busyBtn(b, true); api('admin.results.csv', formData(el('fFilter'))).then(function (r) { downloadText(r.fileName, r.csv, 'text/csv;charset=utf-8'); toast('تم تصدير ' + r.count + ' صفًا', 'ok'); }).catch(showErr).then(function () { busyBtn(b, false); }); });
  el('btnReport').addEventListener('click', function () { showReport(formData(el('fFilter'))); });
  run();
}
function showReport(filter) {
  api('admin.reports', filter).then(function (r) {
    var k = r.kpis;
    var dist = Object.keys(r.distribution).map(function (kk) { return { label: kk, n: r.distribution[kk] }; });
    var body = '<div class="grid c4">' + [['المتدربون', k.trainees], ['المشاركون', k.participants], ['المجتازون', k.passed], ['الشهادات', k.certificates], ['نسبة المشاركة', k.participationRate + '%'], ['نسبة الإكمال', k.completionRate + '%'], ['الورش المنشورة', k.workshopsPublished], ['المحاولات', k.attempts]].map(function (x) { return '<div class="kpi"><div class="n">' + x[1] + '</div><div class="l">' + x[0] + '</div></div>'; }).join('') + '</div>' +
      '<div class="grid c2" style="margin-top:14px"><div class="card tight"><h3>نسبة الإكمال لكل ورشة</h3>' + (r.byWorkshop.length ? barList(r.byWorkshop, 'title', 'completion', 100, 'pct') : emptyState('📭', 'لا بيانات')) + '</div>' +
      '<div class="card tight"><h3>متوسط أفضل نتيجة لكل ورشة</h3>' + (r.byWorkshop.length ? barList(r.byWorkshop, 'title', 'avgBest', 100, 'pct') : emptyState('📭', 'لا بيانات')) + '</div>' +
      '<div class="card tight"><h3>المجتازون بحسب القسم</h3>' + (r.byDepartment.length ? barList(r.byDepartment, 'department', 'passed') : emptyState('📭', 'لا بيانات')) + '</div>' +
      '<div class="card tight"><h3>المشاركون بحسب المسمى الوظيفي</h3>' + (r.byJobTitle.length ? barList(r.byJobTitle, 'jobTitle', 'participants') : emptyState('📭', 'لا بيانات')) + '</div>' +
      '<div class="card tight"><h3>توزيع أفضل النتائج</h3>' + barList(dist, 'label', 'n') + '</div>' +
      '<div class="card tight"><h3>الاجتيازات شهريًا</h3>' + (r.monthly.length ? barList(r.monthly, 'month', 'passed') : emptyState('📭', 'لا بيانات')) + '</div></div><p class="hint">أُنشئ في ' + fmtDate(r.generatedAt, true) + ' — ' + r.filtered + ' سجل ضمن التصفية الحالية — يمكن طباعة هذا التقرير من المتصفح.</p>';
    modal({ title: 'تقرير قياس الأثر', body: body, wide: true, footer: '<button class="btn ghost" type="button" onclick="window.print()">🖨 طباعة</button><button class="btn ghost" data-close>إغلاق</button>' });
  }).catch(showErr);
}

/* ---------- إدارة الحسابات ---------- */
function loadUsers() {
  var box = el('usersTab');
  box.innerHTML = '<div class="card"><div class="row between"><h2 style="margin:0">الحسابات</h2><div class="row"><input type="search" id="uQ" placeholder="بحث..." style="width:220px;min-height:40px" aria-label="بحث في الحسابات"><select id="uStatus" style="width:auto;min-height:40px" aria-label="تصفية بالحالة"><option value="">كل الحالات</option><option value="active">نشط</option><option value="pending">بانتظار التفعيل</option><option value="suspended">موقوف</option></select><select id="uRole" style="width:auto;min-height:40px" aria-label="تصفية بالصلاحية"><option value="">كل الصلاحيات</option><option value="admin">مدير</option><option value="trainee">متدرب</option></select><button class="btn" id="btnNewUser" type="button">＋ إضافة حساب / مدير</button></div></div><div id="usersBody" style="margin-top:10px">' + skeletonList(2) + '</div></div>';
  var run = function () {
    api('admin.users.list', { q: el('uQ').value, status: el('uStatus').value, role: el('uRole').value }).then(function (r) {
      el('usersBody').innerHTML = r.users.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>البريد</th><th>القسم / المسمى</th><th>الصلاحية</th><th>الحالة</th><th>اجتاز</th><th>آخر دخول</th><th><span class="sr-only">إجراءات</span></th></tr></thead><tbody>' + r.users.map(function (u) { return '<tr><td><b>' + h(u.name) + '</b></td><td dir="ltr">' + h(u.email) + '</td><td>' + h(u.department) + '<br><small>' + h(u.jobTitle) + '</small></td><td>' + chipStatus(u.role) + '</td><td>' + chipStatus(u.status) + '</td><td>' + u.passedCount + '</td><td>' + fmtDate(u.lastLoginAt, true) + '</td><td><button class="btn sm ghost" type="button" data-uid="' + h(u.id) + '">تعديل</button></td></tr>'; }).join('') + '</tbody></table></div>' : emptyState('👥', 'لا توجد حسابات مطابقة');
      $$('[data-uid]', el('usersBody')).forEach(function (b) { b.addEventListener('click', function () { editUserDlg(r.users.filter(function (u) { return u.id === b.dataset.uid; })[0], run); }); });
    }).catch(showErr);
  };
  el('uQ').addEventListener('input', debounce(run, 400)); el('uStatus').addEventListener('change', run); el('uRole').addEventListener('change', run);
  el('btnNewUser').addEventListener('click', function () { newUserDlg(run); });
  run();
}
function editUserDlg(u, refresh) {
  var st = S.settings, self = u.id === S.user.id;
  var m = modal({ title: 'تعديل حساب: ' + u.name, body: '<form id="fEU" onsubmit="return false">' + field({ id: 'euName', name: 'name', label: 'الاسم', value: u.name }) + '<div class="field"><label for="euEmail">البريد</label><input id="euEmail" type="email" value="' + h(u.email) + '" disabled></div>' +
    '<div class="grid c2">' + field({ id: 'euJob', name: 'jobTitle', type: 'select', label: 'المسمى الوظيفي', value: u.jobTitle, options: (st.jobTitles.indexOf(u.jobTitle) === -1 && u.jobTitle ? [u.jobTitle] : []).concat(st.jobTitles) }) + field({ id: 'euDept', name: 'department', type: 'select', label: 'القسم', value: u.department, options: (st.departments.indexOf(u.department) === -1 && u.department ? [u.department] : []).concat(st.departments) }) + '</div>' +
    '<div class="grid c2">' + field({ id: 'euRole', name: 'role', type: 'select', label: 'الصلاحية التقنية (مستقلة عن المسمى الوظيفي)', value: u.role, options: [{ value: 'trainee', label: 'متدرب' }, { value: 'admin', label: 'مدير' }] }) + field({ id: 'euStatus', name: 'status', type: 'select', label: 'الحالة', value: u.status, options: [{ value: 'active', label: 'نشط' }, { value: 'pending', label: 'بانتظار التفعيل' }, { value: 'suspended', label: 'موقوف (تُبطل جلساته)' }] }) + '</div>' +
    field({ id: 'euNotes', name: 'notes', label: 'ملاحظات إدارية', value: u.notes || '' }) + field({ id: 'euPw', name: 'resetPassword', type: 'password', label: 'تعيين كلمة مرور جديدة (اختياري)', autocomplete: 'new-password', hint: 'تُبطل الجلسات الحالية للمستخدم' }) + '</form>' + (self ? alertBox('info', 'هذا حسابك — لا يمكنك سحب صلاحياتك أو إيقاف حسابك بنفسك.') : ''),
    footer: '<button class="btn" id="euSave">حفظ</button>' + (self ? '' : '<button class="btn danger" id="euDel">حذف الحساب</button>') + '<button class="btn ghost" data-close>إلغاء</button>' });
  $('#euSave', m.el).addEventListener('click', function () { var d = formData($('#fEU', m.el)); d.id = u.id; if (!d.resetPassword) delete d.resetPassword; var b = this; busyBtn(b, true); api('admin.users.update', d).then(function () { toast('تم الحفظ', 'ok'); m.close(); refresh(); }).catch(function (e) { showErr(e); busyBtn(b, false); }); });
  if ($('#euDel', m.el)) $('#euDel', m.el).addEventListener('click', function () {
    api('admin.users.delete', { id: u.id }).then(function (r) { return confirmDlg('حذف الحساب', 'حذف حساب «' + h(r.name) + '» نهائيًا. تبقى نتائجه (' + r.impact.results + ') وشهاداته (' + r.impact.certificates + ') محفوظة للسجلات. لا يمكن التراجع.', 'حذف', true).then(function (ok) { if (ok) return api('admin.users.delete', { id: u.id, confirm: true }).then(function () { toast('تم الحذف', 'ok'); m.close(); refresh(); }); }); }).catch(showErr);
  });
}
function newUserDlg(refresh) {
  var st = S.settings;
  var m = modal({ title: 'إضافة حساب', body: alertBox('info', 'يصل المستخدم بريد دعوة برمز لتعيين كلمة مروره؛ لا تُمنح الصلاحية إلا بعد إثبات ملكية البريد.') + '<form id="fNU" onsubmit="return false">' + field({ id: 'nuName', name: 'name', label: 'الاسم الكامل', required: true }) + field({ id: 'nuEmail', name: 'email', type: 'email', label: 'البريد الإلكتروني', required: true, hint: 'إذا كان خارج النطاقات المسموحة سيُضاف تلقائيًا إلى الاستثناءات' }) +
    '<div class="grid c2">' + field({ id: 'nuJob', name: 'jobTitle', type: 'select', label: 'المسمى الوظيفي', options: st.jobTitles }) + field({ id: 'nuDept', name: 'department', type: 'select', label: 'القسم', options: st.departments }) + '</div>' + field({ id: 'nuRole', name: 'role', type: 'select', label: 'الصلاحية', options: [{ value: 'trainee', label: 'متدرب' }, { value: 'admin', label: 'مدير' }] }) + '</form>',
    footer: '<button class="btn" id="nuGo">إضافة وإرسال الدعوة</button><button class="btn ghost" data-close>إلغاء</button>' });
  $('#nuGo', m.el).addEventListener('click', function () { var d = formData($('#fNU', m.el)); if (!d.name || d.name.trim().length < 3) { setFieldErr('nuName', 'أدخل الاسم'); return; } if (!/^\S+@\S+\.\S+$/.test(d.email)) { setFieldErr('nuEmail', 'بريد غير صالح'); return; } var b = this; busyBtn(b, true); api('admin.users.create', d).then(function (r) { toast(r.mailSent ? 'تمت الإضافة وأُرسلت الدعوة' : 'تمت الإضافة لكن تعذر إرسال البريد — يمكن للمستخدم طلب رمز عبر «نسيت كلمة المرور»', r.mailSent ? 'ok' : 'warn', 6000); m.close(); refresh(); }).catch(function (e) { showErr(e); busyBtn(b, false); }); });
}

/* ---------- الشهادات ---------- */
route('#/admin/certs', function () {
  adminShell('certs', '<div class="tabs" role="tablist"><button class="active" data-t="list" role="tab" aria-selected="true">الشهادات الصادرة</button><button data-t="tpl" role="tab" aria-selected="false">تصميم الشهادة</button></div><div id="certList"></div><div id="certTpl" style="display:none"></div>', 'الشهادات');
  subTabs(el('adminBody'), [['list', 'certList'], ['tpl', 'certTpl']], { tpl: loadCertTemplate });
  loadCertList();
}, 'admin');
function loadCertList() {
  var box = el('certList');
  box.innerHTML = '<div class="card"><div class="row between"><h2 style="margin:0">الشهادات الصادرة</h2><div class="row"><select id="cKind" style="width:auto;min-height:40px" aria-label="النوع"><option value="">كل الأنواع</option><option value="trainee">إتمام</option><option value="trainer">شكر للمدرب</option></select><input type="search" id="cQ" placeholder="بحث بالاسم أو الرقم..." style="width:240px;min-height:40px" aria-label="بحث"></div></div><div id="certBody" style="margin-top:10px">' + skeletonList(2) + '</div></div>';
  var run = function () {
    api('admin.certs.list', { q: el('cQ').value, kind: el('cKind').value }).then(function (r) {
      var ms = function (s) { if (!s) return '<span class="chip">—</span>'; return '<span class="chip ' + (s.status === 'sent' ? 'ok' : 'err') + '" title="' + h(s.error || '') + '">' + (s.status === 'sent' ? 'أُرسل' : 'فشل') + '</span>' + (s.error ? '<br><small style="color:var(--err)">' + h(String(s.error).substr(0, 60)) + '</small>' : ''); };
      el('certBody').innerHTML = r.certificates.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>الرقم</th><th>النوع</th><th>الاسم</th><th>الورشة</th><th>النسبة</th><th>الإصدار</th><th>بريد المستلم</th><th>بريد الإدارة</th><th>الحالة</th><th><span class="sr-only">إجراءات</span></th></tr></thead><tbody>' + r.certificates.map(function (c) { return '<tr><td dir="ltr">' + h(c.serial) + '</td><td>' + (c.kind === 'trainer' ? '<span class="chip gold">شكر للمدرب</span>' : '<span class="chip info">إتمام</span>') + '</td><td>' + h(c.name) + '<br><small dir="ltr">' + h(c.email) + '</small></td><td>' + h(c.workshopTitle) + '</td><td>' + (c.percent === null || c.percent === undefined ? '—' : pct(c.percent)) + '</td><td>' + fmtDate(c.issuedAt) + '</td><td>' + ms(c.mailStatus.trainee || c.mailStatus.trainer) + '</td><td>' + (c.kind === 'trainer' ? '—' : ms(c.mailStatus.admin)) + '</td><td>' + (c.revoked ? '<span class="chip err">ملغاة</span>' : '<span class="chip ok">صالحة</span>') + '</td><td><div class="row"><a class="btn sm ghost" href="#/cert/' + h(c.id) + '" data-certback>عرض</a>' + (c.revoked ? '' : '<button class="btn sm soft" type="button" data-resend="' + h(c.id) + '">إعادة الإرسال</button>') + '<button class="btn sm ' + (c.revoked ? 'ok' : 'danger') + '" type="button" data-revoke="' + h(c.id) + '">' + (c.revoked ? 'إعادة تفعيل' : 'إلغاء') + '</button></div></td></tr>'; }).join('') + '</tbody></table></div><p class="hint">يُعرض ' + r.certificates.length + ' من ' + r.total + '</p>' : emptyState('🎓', 'لا توجد شهادات بعد');
      $$('[data-certback]', el('certBody')).forEach(function (a) { a.addEventListener('click', function () { store('certBack', 'admin'); }); });
      $$('[data-resend]', el('certBody')).forEach(function (b) { b.addEventListener('click', function () { busyBtn(b, true, 'إرسال'); api('admin.certs.resend', { id: b.dataset.resend }).then(function (r) { var st = r.mailStatus; var bad = Object.keys(st).filter(function (k) { return !st[k].ok; }); toast(bad.length ? 'تعذر الإرسال إلى: ' + bad.map(function (k) { return ({ trainee: 'المتدرب', admin: 'الإدارة', trainer: 'المدرب' })[k] || k; }).join('، ') : 'أُعيد الإرسال بنجاح', bad.length ? 'warn' : 'ok'); run(); }).catch(function (e) { showErr(e); busyBtn(b, false); }); }); });
      $$('[data-revoke]', el('certBody')).forEach(function (b) { b.addEventListener('click', function () { confirmDlg('تغيير حالة الشهادة', 'هل تريد تغيير حالة صلاحية هذه الشهادة؟ ستنعكس الحالة في صفحة التحقق.', 'تأكيد').then(function (ok) { if (ok) api('admin.certs.revoke', { id: b.dataset.revoke }).then(run).catch(showErr); }); }); });
    }).catch(showErr);
  };
  el('cQ').addEventListener('input', debounce(run, 400)); el('cKind').addEventListener('change', run); run();
}
function imgField(id, label, value, hint) {
  return '<div class="field"><span style="font-weight:700;font-size:14px">' + h(label) + '</span><div class="row"><img id="' + id + '_img" class="imgprev" alt="معاينة ' + h(label) + '" style="' + (value ? '' : 'display:none') + '"><input type="hidden" id="' + id + '" value="' + h(value || '') + '"><button class="btn sm soft" type="button" data-up="' + id + '">⬆ رفع صورة</button>' + '<button class="btn sm ghost" type="button" data-clear="' + id + '">إزالة</button><input type="file" accept="image/png,image/jpeg,image/webp" class="sr-only" id="' + id + '_file" aria-label="اختيار ملف ' + h(label) + '"></div><div class="hint">' + (hint || 'PNG/JPEG/WebP بحجم لا يتجاوز 600 كيلوبايت') + '</div></div>';
}
function bindImgFields(root) {
  $$('[data-up]', root).forEach(function (b) { b.addEventListener('click', function () { el(b.dataset.up + '_file').click(); }); });
  $$('[data-clear]', root).forEach(function (b) { b.addEventListener('click', function () { el(b.dataset.clear).value = ''; el(b.dataset.clear + '_img').style.display = 'none'; }); });
  $$('input[type=file]', root).forEach(function (f) { f.addEventListener('change', function () {
    var file = f.files[0]; if (!file) return; var id = f.id.replace(/_file$/, '');
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { toast('الملف يجب أن يكون صورة PNG أو JPEG أو WebP', 'err'); return; }
    if (file.size > 600 * 1024) { toast('حجم الصورة يتجاوز 600 كيلوبايت', 'err'); return; }
    readFileAsDataUrl(file).then(function (du) { return api('admin.assets.upload', { name: file.name, dataUrl: du }).then(function (r) { el(id).value = r.fileId; el(id + '_img').src = du; el(id + '_img').style.display = ''; toast('تم رفع الصورة — احفظ لتثبيتها', 'ok'); }); }).catch(showErr);
  }); });
  $$('input[type=hidden]', root).forEach(function (hid) { if (hid.value && el(hid.id + '_img')) api('admin.assets.get', { id: hid.value }).then(function (r) { if (r.dataUrl) { el(hid.id + '_img').src = r.dataUrl; el(hid.id + '_img').style.display = ''; } }).catch(function () { }); });
}
function loadCertTemplate() {
  var box = el('certTpl'); box.innerHTML = skeletonList(2);
  api('admin.settings.get').then(function (d) {
    var c = d.settings.certificate; var signers = (c.signers || []).slice(); while (signers.length < 2) signers.push({ name: '', title: '', imageId: '' });

  var run = function () { api('admin.mail.list', { status: el('mStatus').value }).then(function (r) { el('mSummary').innerHTML = 'أُرسل: ' + r.counts.sent + ' · فشل: ' + r.counts.failed + ' · في الانتظار: ' + r.counts.queued + ' · منتهٍ: ' + r.counts.expired + (r.quota !== null && r.quota !== undefined ? ' · حصة البريد المتبقية اليوم: <b>' + r.quota + '</b>' : ''); el('mBody').innerHTML = r.mail.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>الوقت</th><th>النوع</th><th>إلى</th><th>الموضوع</th><th>الحالة</th><th>محاولات</th><th>الخطأ</th><th><span class="sr-only">إجراءات</span></th></tr></thead><tbody>' + r.mail.map(function (m) { return '<tr><td>' + fmtDate(m.createdAt, true) + '</td><td>' + h(KIND[m.kind] || m.kind) + '</td><td dir="ltr">' + h(m.to) + '</td><td><small>' + h(m.subject) + '</small></td><td>' + chipStatus(m.status) + '</td><td>' + m.attempts + '</td><td><small>' + h(m.lastError) + '</small></td><td>' + (m.status === 'failed' || m.status === 'queued' ? '<button class="btn sm soft" type="button" data-retry="' + h(m.id) + '">إرسال الآن</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : emptyState('📭', 'لا توجد رسائل'); $$('[data-retry]', el('mBody')).forEach(function (b) { b.addEventListener('click', function () { busyBtn(b, true); api('admin.mail.retry', { id: b.dataset.retry }).then(function (x) { toast(x.sent ? 'أُرسلت' : (x.expired ? 'انتهت صلاحية الرسالة' : 'تعذر الإرسال'), x.sent ? 'ok' : 'warn'); run(); }).catch(function (e) { showErr(e); busyBtn(b, false); }); }); }); }).catch(showErr); };
  el('mStatus').addEventListener('change', run);
  el('mRetryAll').addEventListener('click', function () { var b = this; busyBtn(b, true, 'جارٍ الإرسال'); api('admin.mail.retry', {}).then(function (x) { toast('عولج ' + x.retried + ' — نجح ' + x.sent + '، فشل ' + x.failed + '، منتهٍ ' + x.expired + (x.remaining ? '، متبقٍ ' + x.remaining : ''), 'ok', 7000); run(); }).catch(showErr).then(function () { busyBtn(b, false); }); });
  run();
}
function loadBackup() {
  var box = el('tBackup');
  box.innerHTML = '<div class="grid c2" style="align-items:start"><div class="card"><h2>تصدير نسخة احتياطية</h2><p>تتضمن النسخة: المستخدمين (بدون كلمات المرور)، الورش وإصداراتها، التقدم، المحاولات، النتائج، الشهادات، الإعدادات، سجل العمليات، سجل البريد.<br><b>لا تتضمن:</b> كلمات المرور، الجلسات، رموز التحقق، مفاتيح الخدمات، مهام التوليد.</p><button class="btn" id="bkExport" type="button">⬇ تنزيل ملف JSON</button></div>' +
    '<div class="card"><h2>الاستعادة من ملف</h2><p>يُفحص الملف أولًا وتُعرض المعاينة (عدد السجلات والتعارضات) قبل التنفيذ. السجلات المكررة بالمعرّف تُتجاهل افتراضيًا أو تُستبدل عند اختيار ذلك.</p><button class="drop" id="bkDrop" type="button" style="width:100%">اختر ملف النسخة الاحتياطية (JSON)</button><input type="file" id="bkFile" accept=".json,application/json" class="sr-only" aria-label="ملف النسخة الاحتياطية"><div id="bkPreview" style="margin-top:10px"></div></div></div>';
  el('bkExport').addEventListener('click', function () { var b = this; busyBtn(b, true, 'جارٍ التجهيز'); api('admin.backup.export').then(function (r) { downloadText(r.fileName, r.json, 'application/json'); toast('تم تنزيل النسخة الاحتياطية', 'ok'); }).catch(showErr).then(function () { busyBtn(b, false); }); });
  el('bkDrop').addEventListener('click', function () { el('bkFile').click(); });
  el('bkFile').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return; if (f.size > 4 * 1024 * 1024) { toast('الملف يتجاوز 4MB', 'err'); return; }
    readFileAsText(f).then(function (json) {
      return api('admin.backup.preview', { json: json }).then(function (p) {
        el('bkPreview').innerHTML = alertBox('info', 'نسخة من ' + fmtDate(p.exportedAt, true) + ' (إصدار ' + h(p.app) + ')') + '<div class="table-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>الجدول</th><th>في الملف</th><th>موجود</th><th>تعارض</th><th>غير صالح</th><th>سيُضاف</th></tr></thead><tbody>' + Object.keys(p.report).map(function (t) { var r = p.report[t]; return '<tr><td>' + t + '</td><td>' + r.inFile + '</td><td>' + r.existing + '</td><td>' + r.conflicts + '</td><td>' + r.invalid + '</td><td><b>' + r.willInsert + '</b></td></tr>'; }).join('') + '</tbody></table></div>' +
          '<div class="row" style="margin-top:10px"><label for="bkMode" class="sr-only">سياسة التكرار</label><select id="bkMode" style="width:auto"><option value="skip">تجاهل السجلات المكررة</option><option value="overwrite">استبدال السجلات المكررة</option></select><button class="btn danger" id="bkGo" type="button">تنفيذ الاستيراد</button></div>';
        el('bkGo').addEventListener('click', function () { var b = this; confirmDlg('تنفيذ الاستيراد', 'سيتم إدراج السجلات الجديدة' + (el('bkMode').value === 'overwrite' ? ' واستبدال المكررة' : '') + '. يُنصح بتصدير نسخة احتياطية قبل المتابعة.', 'تنفيذ', true).then(function (ok) { if (!ok) return; busyBtn(b, true, 'جارٍ الاستيراد'); api('admin.backup.import', { json: json, mode: el('bkMode').value }).then(function (r) { el('bkPreview').innerHTML = alertBox('ok', 'اكتمل الاستيراد. ' + h(r.note)) + '<div class="table-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>الجدول</th><th>أُضيف</th><th>استُبدل</th><th>تُجوهل</th><th>مرفوض</th></tr></thead><tbody>' + Object.keys(r.result).map(function (t) { var x = r.result[t]; return '<tr><td>' + t + '</td><td>' + x.inserted + '</td><td>' + x.updated + '</td><td>' + x.skipped + '</td><td>' + x.rejectedCount + (x.rejected.length ? '<br><small>' + x.rejected.map(h).join('<br>') + '</small>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>'; }).catch(function (e) { showErr(e); busyBtn(b, false); }); }); });
      });
    }).catch(function (e) { el('bkPreview').innerHTML = alertBox('err', h(errMsg(e))); });
    this.value = '';
  });
}
</script>
